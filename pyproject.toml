[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gadap-fiscal-core"
version = "0.1.0"
description = "GADAP Fiscal Core - Motor DF-e para emissão de NF-e, NFC-e e NFS-e"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "lxml>=5.1.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]

